name: 장 초반 주가 추적

# 실행은 구글 Apps Script가 평일 08:45 KST에 깃헙 API(workflow_dispatch)로 겁니다.
# 깃헙 자체 예약(schedule)은 지연이 잦고, 같이 켜 두면 두 번 실행되므로 넣지 않습니다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: |
          pip install requests==2.32.3 playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: 추적 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tracker/main.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add results || true
          git diff --cached --quiet || git commit -m "results $(TZ=Asia/Seoul date +%Y%m%d)"
          git pull --rebase || true
          git push || true
