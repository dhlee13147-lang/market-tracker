name: 장 초반 주가 추적

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 평일 08:30 KST (UTC 일~목 23:30). 깃헙 예약은 수 분~십수 분 늦을 수 있어 일찍 시작해 대기
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: |
          pip install requests==2.32.3 playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: 추적 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tracker/main.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add results || true
          git diff --cached --quiet || git commit -m "results $(TZ=Asia/Seoul date +%Y%m%d)"
          git push || true
